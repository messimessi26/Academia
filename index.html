<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>Meu Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7;--card:#FFFFFF;--text:#111827;--muted:#6B7280;--line:#E5E7EB;--soft:#EEF0F3;--pill:#FFFFFF;--pillLine:#D9DCE1;
  --acc:#0F766E;--accText:#0F766E;--ok:#16A34A;--warn:#C2410C;--prot:#2563EB;--carb:#F59E0B;--gord:#DB2777;
  --tab:#2B2F36;--tabText:#C9CDD3;--shadow:0 6px 18px rgba(17,24,39,.10);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1013;--card:#171A1F;--text:#ECEEF1;--muted:#9AA1AC;--line:#2A2F37;--soft:#1F232A;--pill:#1C2026;--pillLine:#333944;
  --acc:#2DD4BF;--accText:#5EEAD4;--ok:#4ADE80;--warn:#FB923C;--prot:#60A5FA;--carb:#FBBF24;--gord:#F472B6;
  --tab:#22262D;--tabText:#AEB4BE;--shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1013;--card:#171A1F;--text:#ECEEF1;--muted:#9AA1AC;--line:#2A2F37;--soft:#1F232A;--pill:#1C2026;--pillLine:#333944;
  --acc:#2DD4BF;--accText:#5EEAD4;--ok:#4ADE80;--warn:#FB923C;--prot:#60A5FA;--carb:#FBBF24;--gord:#F472B6;
  --tab:#22262D;--tabText:#AEB4BE;--shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--accText)}
.app{max-width:760px;margin:0 auto;padding:12px 14px 110px}
@media (min-width:1000px){.app{max-width:900px}}
.small{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 2px 12px;gap:8px}
.hdr h1{margin:0;font-size:19px;font-weight:600;text-align:center}
.hdr .r{justify-self:end}
.streak{font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:4px}
.wknav{display:flex;align-items:center;gap:6px;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);text-transform:capitalize}
.wknav span{flex:1;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:2px 0 14px;gap:2px}
.week button{border:0;background:transparent;border-radius:16px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center}
.week span{font-size:13px;color:var(--muted)}
.week b{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:500;color:var(--muted);margin-top:4px}
.week .today b{color:var(--text);font-weight:800}
.week .sel b{background:var(--text);color:var(--bg);font-weight:800}
.week i{display:block;width:6px;height:6px;border-radius:50%;margin:4px auto 0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;border-radius:22px;padding:16px;min-height:132px;color:#fff;background:var(--c);display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:var(--shadow);overflow:hidden;border:0;text-align:left}
.tile::before{content:"";position:absolute;right:-28px;bottom:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.tile::after{content:"";position:absolute;right:30px;bottom:-60px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.08)}
.tile b{font-size:19px;font-weight:700;position:relative;z-index:1}
.tile .meta{font-size:12px;opacity:.85;position:relative;z-index:1}
.tile .kb{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}
.tile .ic{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.fab{position:fixed;right:max(18px,calc(50% - 360px));bottom:96px;width:62px;height:62px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;line-height:1;box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:15;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:15px;font-weight:700}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:14px;font-weight:600;padding:9px 14px;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:42px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.circbtn{width:46px;height:46px;border-radius:50%;background:var(--card);border:0;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none;flex-shrink:0}
/* tela do treino */
.tdhead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:4px 0 14px}
.tdhead h1{margin:0;font-size:19px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{border:0;border-radius:999px;color:#fff;font-weight:700;font-size:15px;padding:12px 22px;background:var(--c);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.tdstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 0 16px;border-bottom:1px solid var(--line);margin-bottom:6px;text-align:center}
.tdstats span{display:block;font-size:13px;color:var(--muted)}
.tdstats b{display:block;font-size:22px;font-weight:700;margin-top:4px}
.tdstats .dur{color:var(--c)}
.exrow{display:flex;align-items:center;gap:12px;padding:12px 0}
.av{width:52px;height:52px;border-radius:50%;background:var(--soft);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--c);flex-shrink:0}
.exname{flex:1;min-width:0;font-weight:600;font-size:16px;background:none;border:0;text-align:left;padding:6px 0}
.exname.open{color:var(--c)}
.kebab{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text)}
.chev{width:38px;height:38px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0}
.exbody{padding:0 0 10px}
.note{width:100%;border:0;background:transparent;font-size:15px;color:var(--text);padding:4px 0 10px;resize:none}
.note::placeholder{color:var(--muted)}
.sethead,.setr{display:grid;grid-template-columns:52px 1fr 1fr 1fr 34px;gap:8px;align-items:center}
.sethead{font-size:12px;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.setr{padding:8px 0;border-bottom:1px solid var(--line)}
.circ{width:46px;height:46px;border-radius:50%;border:2px solid var(--c);background:transparent;display:flex;align-items:center;justify-content:center}
.circ[aria-pressed="true"]{background:var(--c)}
.pillin{position:relative}
.pillin input{width:100%;height:48px;border-radius:999px;border:1.5px solid var(--pillLine);background:var(--pill);text-align:center;font-size:17px;font-weight:600;padding:0 22px 0 8px}
.pillin.noU input{padding:0 8px}
.pillin em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;color:var(--muted);pointer-events:none}
.setr.done .pillin input{border-color:var(--c)}
.addset{width:100%;border:0;border-radius:14px;background:var(--soft);font-weight:600;padding:13px;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.addex{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;padding:14px 0;font-size:16px;font-weight:600;text-align:left}
.addex .plus{width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:400;flex-shrink:0}
.sep{border:0;border-top:1px solid var(--line);margin:0}
.banner{border-radius:18px;padding:14px 16px;color:#fff;background:var(--c);display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;text-decoration:none}
/* gerais */
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.big small{font-size:14px;font-weight:600;color:var(--muted)}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar>div{height:100%;border-radius:6px}
.macro{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft);font-size:14px}
.list li:last-child{border-bottom:0}
.list .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .v{font-weight:600;white-space:nowrap;color:var(--muted);font-size:13px}
.del{border:0;background:transparent;width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted)}
.del svg{stroke:currentColor}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600}
.field .hint{font-weight:400;color:var(--muted);font-size:11px}
.in,.field input,.field select,.field textarea,td input,td select{width:100%;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;font-size:15px}
.field textarea{height:auto;min-height:70px;padding:10px 12px}
.num{text-align:right}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--soft);border-radius:14px;padding:10px 12px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:700;margin-top:3px;white-space:nowrap}
.pos{color:var(--ok)}.neg,.warn{color:var(--warn)}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:inherit;fill:var(--muted);font-size:12px}
.keys{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px}
.seg a,.seg button{flex:1;text-align:center;border:0;background:transparent;border-radius:10px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none}
.seg [aria-current="page"],.seg [aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tablewrap{overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--soft);vertical-align:middle}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.preview{font-size:13px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:#fff}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--text)}
/* barra de abas */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 28px));background:var(--tab);border-radius:999px;display:flex;justify-content:space-around;padding:8px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tabText);text-decoration:none;font-size:10px;border-radius:999px;padding:8px 0}
.tabbar a svg{stroke:var(--tabText)}
.tabbar a[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff}
.tabbar a[aria-current="page"] svg{stroke:#fff}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--card);border-radius:999px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:10px;font-weight:700;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap}
.timer button{border:0;border-radius:999px;padding:6px 12px;font-weight:600;background:rgba(127,127,127,.25);color:inherit}
.timer.end{background:var(--ok);color:#fff}
dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--text);width:min(460px,calc(100% - 20px));box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form,.sheet{padding:18px;display:flex;flex-direction:column;gap:12px}
dialog .row{display:flex;gap:10px}
dialog .row>*{flex:1}
dialog .actions{display:flex;justify-content:flex-end;gap:8px}
.sheet h2{margin:0 0 2px;font-size:17px}
.sheet .opt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--soft);border-radius:14px;padding:14px;font-weight:600;font-size:15px;text-align:left}
.sheet .opt.danger{color:var(--warn)}
.welcome{background:var(--card);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.welcome h2{margin:0;font-size:22px}
.welcome p{margin:0;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="app"><div id="view"></div></div>
<nav class="tabbar" id="tabbar" aria-label="Menu"></nav>
<div class="timer" id="timer" hidden role="status" aria-live="polite"><span id="timerTxt"></span><button data-act="timer+">+30s</button><button data-act="timerStop">Fechar</button></div>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>
<datalist id="dlFoods"></datalist>
<datalist id="dlEx"></datalist>

var RIGHT='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
var DUMB='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>';

/* ---------- cores dos treinos ---------- */
var PALETA=[['vinho','#9F1239'],['azul','#2563EB'],['ardosia','#4B5D6B'],['indigo','#3730A3'],['laranja','#EA580C'],['verde','#047857'],['roxo','#7C3AED'],['teal','#0F766E']];

/* ---------- alimentos (aprox. por 100 g ou 100 ml) ---------- */
var FOODS=[
['arroz','Arroz branco cozido',128,2.5,28.1,0.2,0,''],['arrozint','Arroz integral cozido',124,2.6,25.8,1,0,''],['feijaoc','Feijão carioca cozido',76,4.8,13.6,0.5,0,''],['feijaop','Feijão preto cozido',77,4.5,14,0.5,0,''],

['ovo','Ovo cozido',146,13.3,0.6,9.5,50,'ovo'],['ovofrito','Ovo frito',240,15.6,1.2,18.6,50,'ovo'],['clara','Clara de ovo cozida',50,11,0.7,0.2,33,'clara'],['tilapia','Tilápia grelhada',128,26,0,2.7,0,''],

var LS_KEY='meu-treino-v1',APP_ID='academia';
var store={kind:'local'},cloud={uid:null,nome:'',unsub:null},statusTxt='Carregando…';
function setStatus(t){statusTxt=t;var el=document.getElementById('status');if(el)el.textContent=t;}
function readLocal(){try{var r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function writeLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));return true;}catch(e){return false;}}
function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'));},ms);Promise.resolve(p).then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
var saveTimer=null,saving=false,pending=false;
function save(){writeLocal();clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);}
async function flush(){
  if(store.kind!=='cloud'||!cloud.uid){setStatus(writeLocal()?'Salvo neste aparelho':'Não foi possível salvar');return;}
  if(saving){pending=true;return;}
  saving=true;setStatus('Salvando…');
  try{await withTimeout(FB.save(cloud.uid,APP_ID,JSON.stringify(S)),15000);setStatus('Sincronizado com a sua conta');}
  catch(e){setStatus('Sem conexão: salvo neste aparelho');}
  saving=false;if(pending){pending=false;flush();}
}
function commit(){save();render();}
function isEmpty(d){return !d.treinos.length&&!d.sessoes.length&&!d.pesos.length&&!Object.keys(d.diario).length&&!d.meta.kcal;}
function initCloud(){
  if(!window.FB)return;
  FB.onUser(function(u){
    if(cloud.unsub){cloud.unsub();cloud.unsub=null;}
    cloud.uid=u?u.uid:null;cloud.nome=u?(u.displayName||u.email||''):'';
    if(!u){store={kind:'local'};setStatus('Salvo neste aparelho');render();return;}
    setStatus('Conectando…');var first=true;
    cloud.unsub=FB.watch(u.uid,APP_ID,function(snap){
      if(snap.metadata.hasPendingWrites)return;
      var remote=null;if(snap.exists()){try{remote=migrate(JSON.parse((snap.data()||{}).estado));}catch(e){}}
      if(first){first=false;store={kind:'cloud'};
        if(remote){S=remote;writeLocal();}else if(!isEmpty(S))flush();
        setStatus('Sincronizado com a sua conta');render();return;}
      if(remote){S=remote;writeLocal();render();setStatus('Sincronizado com a sua conta');}
    },function(){store={kind:'local'};setStatus('Sem acesso à conta: salvo neste aparelho');});
  });
}

  out.push({data:s.data,max:Math.max.apply(null,e.sets.map(function(x){return x.carga;})),rm:Math.max.apply(null,e.sets.map(function(x){return x.reps>0?x.carga*(1+x.reps/30):0;})),vol:e.sets.reduce(function(a,x){return a+x.reps*x.carga;},0),reps:e.sets.reduce(function(a,x){return a+x.reps;},0),sets:e.sets});});return out;}
function exNames(){var m={};S.sessoes.forEach(function(s){s.ex.forEach(function(e){m[norm(e.nome)]=m[norm(e.nome)]||e.nome;});});S.treinos.forEach(function(t){t.ex.forEach(function(e){m[norm(e.nome)]=m[norm(e.nome)]||e.nome;});});return Object.keys(m).map(function(k){return m[k];}).sort();}

function streak(){ // semanas seguidas com pelo menos 1 treino
  if(!S.sessoes.length)return 0;var wk=function(d){var x=toD(d);x.setDate(x.getDate()-x.getDay());return ds(x);};
  var set={};S.sessoes.forEach(function(s){set[wk(s.data)]=1;});var cur=wk(TODAY),n=0;if(!set[cur])cur=addDays(cur,-7);
  while(set[cur]){n++;cur=addDays(cur,-7);}return n;}

  // senão: o treino feito há mais tempo
  var best=null,bd='9999';S.treinos.forEach(function(x){var l=lastSessaoDe(x.id),d=l?l.data:'0000';if(d<bd){bd=d;best=x;}});return best;}

  S.ativo={treino:t.id,nome:t.nome,cor:t.cor,data:data||TODAY,inicio:Date.now(),ex:t.ex.map(function(e){return {id:e.id,nome:e.nome,nota:e.nota||'',sets:e.sets.map(function(s){return {carga:s.carga,reps:s.reps,desc:s.desc,ok:false};})};})};
}
function finalizar(){
  var a=S.ativo,t=treinoById(a.treino);
  var exs=a.ex.map(function(e){return {nome:e.nome,sets:e.sets.filter(function(s){return s.ok;}).map(function(s){return {carga:s.carga,reps:s.reps};})};}).filter(function(e){return e.sets.length;});
  if(!exs.length){if(confirm('Nenhuma série foi marcada como feita. Descartar este treino?')){S.ativo=null;stopTimer();commit();}return;}
  var pend=a.ex.reduce(function(n,e){return n+e.sets.filter(function(s){return !s.ok;}).length;},0);
  if(pend&&!confirm(pend+' série(s) não foram marcadas e não entram no histórico. Finalizar mesmo assim?'))return;
  S.sessoes.push({id:uid(),data:a.data,treino:a.treino,treinoNome:a.nome,cor:a.cor,ex:exs,min:Math.round((Date.now()-a.inicio)/60000)});
  // o treino passa a abrir com os valores de hoje (carga e reps da última vez)
  if(t)t.ex=a.ex.map(function(e){return {id:e.id||uid(),nome:e.nome,nota:e.nota||'',sets:e.sets.map(function(s){return {carga:s.carga,reps:s.reps,desc:s.desc};})};});
  ui.sel=a.data;S.ativo=null;stopTimer();commit();location.hash=a.data===TODAY?'inicio':'treinos';

  var kcal=Math.max(1200,Math.round((tdee+adj)/10)*10),prot=Math.round(w*2),gord=Math.round(w*0.9),carb=Math.max(0,Math.round((kcal-prot*4-gord*9)/4));return {kcal:kcal,prot:prot,carb:carb,gord:gord,tdee:Math.round(tdee)};}

  var def=gasto+exDia-comer,kgSem=def*7/7700;

/* ---------- gráficos SVG ---------- */
function niceScale(lo,hi){if(lo===hi){lo-=1;hi+=1;}var span=hi-lo,step=Math.pow(10,Math.floor(Math.log10(span/4)));var err=span/4/step;step*=err>=5?10:err>=2.5?5:err>=1.5?2:1;return {lo:Math.floor(lo/step)*step,hi:Math.ceil(hi/step)*step,step:step};}
function chart(labels,series,opt){
  opt=opt||{};var W=640,H=230,L=46,R=W-10,T=12,B=H-28,vals=[];series.forEach(function(s){s.v.forEach(function(v){if(v!=null)vals.push(v);});});if(!vals.length)return '';
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);if(opt.zero)lo=Math.min(0,lo);var sc=niceScale(lo,hi);
  var Y=function(v){return T+(sc.hi-v)/(sc.hi-sc.lo)*(B-T);},n=labels.length,bw=Math.min(28,(R-L)/n*0.6),X=function(i){return opt.bars?L+(i+0.5)*(R-L)/n:(n<2?(L+R)/2:L+i*(R-L)/(n-1));};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(series.map(function(x){return x.name;}).join(', '))+'">';
  for(var v=sc.lo;v<=sc.hi+sc.step/2;v+=sc.step){var y=Y(v);s+='<line x1="'+L+'" x2="'+R+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="3 4"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+(Math.abs(v)>=10000?n0(v/1000)+' mil':n1(v))+'</text>';}
  var every=Math.ceil(n/7);labels.forEach(function(l,i){if(i%every===0||i===n-1)s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(l)+'</text>';});
  series.forEach(function(se){
    if(se.bar){se.v.forEach(function(v,i){if(v==null)return;var y=Y(Math.max(v,0)),y0=Y(Math.max(sc.lo,0));s+='<rect x="'+(X(i)-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(y0-y,1)+'" rx="5" fill="'+se.c+'"><title>'+esc(labels[i])+': '+n0(v)+(opt.unit||'')+'</title></rect>';});return;}
    var d='';se.v.forEach(function(v,i){if(v==null)return;d+=(d?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);});
    s+='<path d="'+d+'" fill="none" stroke="'+se.c+'" stroke-width="2.5" stroke-linejoin="round"'+(se.dash?' stroke-dasharray="6 5"':'')+'/>';
    if(!se.noDots)se.v.forEach(function(v,i){if(v==null)return;s+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.5" fill="var(--card)" stroke="'+se.c+'" stroke-width="2"><title>'+esc(labels[i])+': '+n1(v)+(opt.unit||'')+'</title></circle>';});});
  return '<div class="chart">'+s+'</svg></div>';
}
