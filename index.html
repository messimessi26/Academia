<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F1;--card:#FFFFFF;--text:#0F172A;--muted:#64748B;--line:#E2E8F0;--soft:#F1F5F4;--soft2:#F5F7F7;
  --acc:#0F766E;--accText:#0F766E;--acc2:#14B8A6;--tint:#E6F4F2;--tint2:#CCEBE6;
  --prot:#2563EB;--carb:#F59E0B;--gord:#EC4899;--ok:#16A34A;--warn:#C2410C;--shadow:0 1px 2px rgba(15,23,42,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1110;--card:#131C1B;--text:#E6EEEC;--muted:#94A3A0;--line:#24302E;--soft:#1A2523;--soft2:#182120;
  --acc:#14B8A6;--accText:#5EEAD4;--acc2:#2DD4BF;--tint:#12302C;--tint2:#134E48;
  --prot:#60A5FA;--carb:#FBBF24;--gord:#F472B6;--ok:#4ADE80;--warn:#FB923C;--shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1110;--card:#131C1B;--text:#E6EEEC;--muted:#94A3A0;--line:#24302E;--soft:#1A2523;--soft2:#182120;
  --acc:#14B8A6;--accText:#5EEAD4;--acc2:#2DD4BF;--tint:#12302C;--tint2:#134E48;
  --prot:#60A5FA;--carb:#FBBF24;--gord:#F472B6;--ok:#4ADE80;--warn:#FB923C;--shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--accText)}
.app{display:flex;gap:16px;padding:16px;max-width:1280px;margin:0 auto;min-height:100vh;align-items:flex-start}
.side{flex:0 0 220px;background:var(--card);border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:16px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.small{font-size:12px;color:var(--muted)}
.navlabel{font-size:11px;color:var(--muted);padding:12px 8px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;color:var(--text);text-decoration:none;font-size:13px}
.nav a svg{stroke:var(--muted);flex-shrink:0}
.nav a[aria-current="page"]{background:var(--tint);font-weight:600}
.nav a[aria-current="page"] svg{stroke:var(--acc)}
.nav a:hover{background:var(--soft)}
.theme{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 6px;font-size:13px;margin-top:8px;border-top:1px solid var(--soft)}
.seg{display:flex;gap:2px;background:var(--soft);border-radius:999px;padding:3px}
.seg button{width:28px;height:28px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow)}
.seg svg{stroke:var(--text)}
.status{font-size:11px;color:var(--muted);padding:4px 10px}
.top{background:var(--card);border-radius:18px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:20px;letter-spacing:-.02em}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13px;font-weight:600;padding:9px 14px;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:40px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:1100px){.s4,.s6,.s8{grid-column:span 12}}
h2{margin:0;font-size:14px;font-weight:700}
h3{margin:0;font-size:13px;font-weight:600}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.big small{font-size:14px;font-weight:600;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar>div{height:100%;border-radius:6px}
.macro{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:12px}
.macro b{font-weight:700}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--soft);font-size:13px}
.list li:last-child{border-bottom:0}
.list .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .v{font-weight:600;white-space:nowrap;color:var(--muted);font-size:12px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border-radius:12px;background:var(--soft2);padding:8px 4px;text-align:center;font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center;border:2px solid transparent}
.day.today{border-color:var(--acc)}
.day b{font-size:12px}
.day .t{font-weight:700;color:var(--accText);min-height:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.done{background:var(--tint)}
.chk{width:20px;height:20px;border-radius:50%;background:var(--ok);display:inline-flex;align-items:center;justify-content:center}
.panel{background:var(--card);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:16px}
.intro{margin:0;color:var(--muted);font-size:13px;line-height:1.5;max-width:70ch}
.tablewrap{overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--soft);vertical-align:middle}
.in,td input,td select,.field input,.field select,.field textarea{width:100%;height:40px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:0 10px}
.field textarea{height:auto;min-height:70px;padding:8px 10px;resize:vertical}
td input.num,.num{text-align:right}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600}
.field .hint{font-weight:400;color:var(--muted);font-size:11px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.del{border:0;background:transparent;width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.del svg{stroke:var(--muted)}
.del:hover{background:var(--soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--soft2);border-radius:12px;padding:10px 12px}
.stat .l{font-size:11px;color:var(--muted)}
.stat .v{font-size:17px;font-weight:700;margin-top:3px;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--warn)}.warn{color:var(--warn)}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:inherit;fill:var(--muted);font-size:11px}
.keys{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--muted)}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tag{display:inline-block;font-size:11px;font-weight:600;background:var(--tint);color:var(--accText);padding:2px 8px;border-radius:999px}
/* registrar treino */
.ex{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ex.done{border-color:var(--acc2);background:var(--tint)}
.ex h3{font-size:15px}
.setrow{display:grid;grid-template-columns:44px 1fr 1fr 48px;gap:8px;align-items:center}
.setrow .lbl{font-size:12px;color:var(--muted);text-align:center}
.setrow input{height:46px;font-size:16px;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:10px;width:100%}
.okbtn{width:48px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.okbtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.okbtn svg{stroke:var(--muted)}
.okbtn[aria-pressed="true"] svg{stroke:#fff}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--text);color:var(--card);border-radius:999px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:12px;font-weight:700;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.timer button{border:0;border-radius:999px;padding:6px 12px;font-weight:600;background:rgba(255,255,255,.18);color:inherit}
.timer.end{background:var(--ok);color:#fff}
/* mobile */
.tabbar{display:none}
@media (max-width:760px){
  .app{padding:10px 10px 84px;gap:10px}
  .side{display:none}
  .top{border-radius:14px;padding:10px 12px}
  .top h1{font-size:18px}
  .card,.panel{border-radius:14px;padding:14px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);text-decoration:none;padding:4px 0}
  .tabbar a svg{stroke:var(--muted)}
  .tabbar a[aria-current="page"]{color:var(--accText);font-weight:700}
  .tabbar a[aria-current="page"] svg{stroke:var(--acc)}
  .timer{bottom:84px}
}
dialog{border:0;border-radius:18px;padding:0;background:var(--card);color:var(--text);width:min(460px,calc(100% - 24px));box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,23,42,.45)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
dialog .row{display:flex;gap:10px}
dialog .row>*{flex:1}
dialog .actions{display:flex;justify-content:flex-end;gap:8px}
.welcome{background:var(--card);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.welcome h2{font-size:22px;letter-spacing:-.02em}
.welcome p{margin:0;color:var(--muted);max-width:60ch;line-height:1.5}
.preview{font-size:12px;color:var(--muted);background:var(--soft2);border-radius:10px;padding:8px 10px}
</style>
</head>

/* ---------- armazenamento: navegador + Firebase ---------- */
var LS_KEY='meu-treino-v1',APP_ID='academia';
var store={kind:'local'},cloud={uid:null,nome:'',unsub:null};
function setStatus(t){var el=document.getElementById('status');if(el)el.textContent=t;}
function readLocal(){try{var r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function writeLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));return true;}catch(e){return false;}}
function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'));},ms);Promise.resolve(p).then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
var saveTimer=null,saving=false,pending=false;
function save(){writeLocal();clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);}
async function flush(){
  if(store.kind!=='cloud'||!cloud.uid){setStatus(writeLocal()?'Salvo neste navegador':'Não foi possível salvar');return;}
  if(saving){pending=true;return;}
  saving=true;setStatus('Salvando…');
  try{await withTimeout(FB.save(cloud.uid,APP_ID,JSON.stringify(S)),15000);setStatus('Sincronizado');}
  catch(e){setStatus('Sem conexão: salvo neste navegador');}
  saving=false;if(pending){pending=false;flush();}
}
function commit(){save();render();}
function renderAuth(){var b=document.getElementById('authBtn');b.hidden=!window.FB;document.getElementById('authTxt').textContent=cloud.uid?'Sair':'Entrar com Google';
  b.title=cloud.uid?'Conectado como '+cloud.nome+': sincroniza entre aparelhos':'Entre para sincronizar entre aparelhos';}
function parseRemote(snap){if(!snap.exists())return null;try{return migrate(JSON.parse((snap.data()||{}).estado));}catch(e){return null;}}
function isEmpty(d){return !d.treinos.length&&!d.sessoes.length&&!d.pesos.length&&!Object.keys(d.diario).length&&!d.meta.kcal;}
function initCloud(){
  if(!window.FB)return;renderAuth();
  FB.onUser(function(u){
    if(cloud.unsub){cloud.unsub();cloud.unsub=null;}
    cloud.uid=u?u.uid:null;cloud.nome=u?(u.displayName||u.email||''):'';renderAuth();
    if(!u){store={kind:'local'};setStatus('Salvo neste navegador');return;}
    setStatus('Conectando…');var first=true;
    cloud.unsub=FB.watch(u.uid,APP_ID,function(snap){
      if(snap.metadata.hasPendingWrites)return;
      var remote=parseRemote(snap);
      if(first){first=false;store={kind:'cloud'};
        if(remote){S=remote;writeLocal();render();setStatus('Sincronizado');}
        else if(!isEmpty(S))flush();else setStatus('Sincronizado');return;}
      if(remote){S=remote;writeLocal();render();setStatus('Sincronizado');}
    },function(){store={kind:'local'};setStatus('Sem acesso à conta: salvo neste navegador');});
  });
}

  for(var i=0;i<ss.length;i++){if(antesDe&&ss[i].data>antesDe)continue;var e=ss[i].ex.find(function(x){return norm(x.nome)===k;});if(e&&e.sets.length)return {data:ss[i].data,sets:e.sets};}return null;}

function volume(sess){return sess.ex.reduce(function(a,e){return a+e.sets.reduce(function(b,s){return b+s.reps*s.carga;},0);},0);}

  out.push({data:s.data,max:Math.max.apply(null,e.sets.map(function(x){return x.carga;})),rm:Math.max.apply(null,e.sets.map(e1rm)),vol:e.sets.reduce(function(a,x){return a+x.reps*x.carga;},0),sets:e.sets});});return out;}

  var bmr=10*w+6.25*h-5*a+(p.sexo==='f'?-161:5),tdee=bmr*(+p.ativ||1.55),adj=p.obj==='perder'?-500:p.obj==='ganhar'?300:0;

/* ---------- gráfico de linhas (SVG) ---------- */
function niceScale(lo,hi){if(lo===hi){lo-=1;hi+=1;}var span=hi-lo,step=Math.pow(10,Math.floor(Math.log10(span/4)));var err=span/4/step;step*=err>=5?10:err>=2.5?5:err>=1.5?2:1;return {lo:Math.floor(lo/step)*step,hi:Math.ceil(hi/step)*step,step:step};}
function lineChart(labels,series,unit){
  var W=760,H=240,L=48,R=W-12,T=12,B=H-28,vals=[];series.forEach(function(s){s.v.forEach(function(v){if(v!=null)vals.push(v);});});
  if(!vals.length)return '';
  var sc=niceScale(Math.min.apply(null,vals),Math.max.apply(null,vals));
  var Y=function(v){return T+(sc.hi-v)/(sc.hi-sc.lo)*(B-T);},n=labels.length,X=function(i){return n<2?(L+R)/2:L+i*(R-L)/(n-1);};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(series.map(function(x){return x.name;}).join(', '))+'">';
  for(var v=sc.lo;v<=sc.hi+sc.step/2;v+=sc.step){var y=Y(v);s+='<line x1="'+L+'" x2="'+R+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="3 4"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+n1(v)+'</text>';}
  var every=Math.ceil(n/8);labels.forEach(function(l,i){if(i%every===0||i===n-1)s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(l)+'</text>';});
  series.forEach(function(se){var d='';se.v.forEach(function(v,i){if(v==null)return;d+=(d?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);});
    s+='<path d="'+d+'" fill="none" stroke="'+se.c+'" stroke-width="2.5" stroke-linejoin="round"'+(se.dash?' stroke-dasharray="5 4"':'')+'/>';
    se.v.forEach(function(v,i){if(v==null)return;s+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.5" fill="var(--card)" stroke="'+se.c+'" stroke-width="2"><title>'+esc(labels[i])+': '+n1(v)+(unit||'')+'</title></circle>';});});
  return s+'</svg>';
}

  case 'exUp':if(treino&&tr){var i=treino.ex.findIndex(function(x){return x.id===tr.dataset.eid;});if(i>0){var tmp=treino.ex[i-1];treino.ex[i-1]=treino.ex[i];treino.ex[i]=tmp;commit();}}return;
  case 'comecar':if(S.rascunho&&!confirm('Você tem um treino em andamento ('+S.rascunho.nome+'). Começar outro e descartar esse?'))return;startDraft(t.dataset.t,TODAY);save();location.hash='registrar';if(ui.view==='registrar')render();return;
  case 'okSet':if(exb&&sr){var re=S.rascunho.ex[+exb.dataset.ei],st=re.sets[+sr.dataset.si];st.ok=!st.ok;commit();if(st.ok)startTimer(re.desc||90);var b=document.querySelector('[data-ei="'+exb.dataset.ei+'"] [data-si="'+sr.dataset.si+'"] .okbtn');if(b)b.focus();}return;
  case 'addSet':if(exb){var r2=S.rascunho.ex[+exb.dataset.ei],ls=r2.sets[r2.sets.length-1]||{reps:10,carga:0};r2.sets.push({reps:ls.reps,carga:ls.carga,ok:false});commit();}return;
  case 'rmSet':if(exb){S.rascunho.ex[+exb.dataset.ei].sets.pop();commit();}return;
  case 'delRex':if(exb){S.rascunho.ex.splice(+exb.dataset.ei,1);commit();}return;
  case 'addRex':var nr=document.getElementById('novoRex'),nm=nr&&nr.value.trim();if(nm){var l=lastSets(nm);S.rascunho.ex.push({nome:nm,meta:'',desc:90,sets:l?l.sets.map(function(s){return {reps:s.reps,carga:s.carga,ok:false};}):[{reps:10,carga:0,ok:false},{reps:10,carga:0,ok:false},{reps:10,carga:0,ok:false}]});commit();refocus('novoRex');}return;
  case 'salvarTreino':salvarTreino();return;
  case 'descartar':if(confirm('Descartar este treino sem salvar?')){S.rascunho=null;stopTimer();commit();}return;
  case 'timer+':ui.timerEnd=Math.max(ui.timerEnd,Date.now())+30000;document.getElementById('timer').classList.remove('end');drawTimer();return;
  case 'timerStop':stopTimer();return;
  case 'addPeso':var pv=pnum(document.getElementById('pesoHoje').value);if(pv>0){setPeso(TODAY,pv);commit();}return;
  case 'addPeso2':var pk=pnum(document.getElementById('pesoKg').value),pd=document.getElementById('pesoData').value||TODAY;if(pk>0){setPeso(pd,pk);commit();}return;
  case 'delPeso':S.pesos=S.pesos.filter(function(p){return p.data!==t.dataset.d;});commit();return;
  case 'delSessao':var se=S.sessoes.find(function(x){return x.id===t.dataset.id;});if(se&&confirm('Excluir o treino de '+fmtD(se.data)+'?')){S.sessoes.splice(S.sessoes.indexOf(se),1);commit();}return;
  case 'addFood':openFood(t.dataset.ctx,t.dataset.ref);return;
  case 'delFood':var arr=t.dataset.ctx==='plano'?S.plano:diaDe(ui.dia);var k=arr.findIndex(function(x){return x.id===t.dataset.id;});if(k>-1){arr.splice(k,1);commit();}return;
  case 'diaPrev':ui.dia=addDays(ui.dia,-1);render();return;
  case 'diaNext':ui.dia=addDays(ui.dia,1);render();return;
  case 'diaHoje':ui.dia=TODAY;render();return;
  case 'copiarPlano':if(!S.plano.length){alert('Seu plano de dieta está vazio. Monte em Dieta e metas.');return;}S.plano.forEach(function(e){diaDe(ui.dia).push({id:uid(),ref:e.ref,food:e.food,qtd:e.qtd,modo:e.modo});});commit();return;
  case 'copiarOntem':var on=S.diario[addDays(ui.dia,-1)]||[];if(!on.length){alert('O dia anterior está vazio.');return;}on.forEach(function(e){diaDe(ui.dia).push({id:uid(),ref:e.ref,food:e.food,qtd:e.qtd,modo:e.modo});});commit();return;
  case 'usarSug':var sg=sugestaoMetas();if(sg){S.meta={kcal:sg.kcal,prot:sg.prot,carb:sg.carb,gord:sg.gord};commit();}return;
  case 'addRef':S.refeicoes.push('Refeição '+(S.refeicoes.length+1));commit();return;
  case 'delRef':var ri=+t.dataset.i,rn=S.refeicoes[ri];if(confirm('Excluir a refeição “'+rn+'” do plano?')){S.refeicoes.splice(ri,1);S.plano=S.plano.filter(function(x){return x.ref!==rn;});commit();}return;
  case 'novoAlimento':S.alimentos.push({id:'c:'+uid(),nome:'Novo alimento',kcal:0,prot:0,carb:0,gord:0,u:0,un:''});commit();setTimeout(function(){var r=document.querySelectorAll('[data-fid] input[data-ff=nome]');if(r.length){r[r.length-1].focus();r[r.length-1].select();}},0);return;
  case 'delAlimento':var fr=t.closest('[data-fid]');if(fr&&confirm('Excluir este alimento? Ele some das refeições onde foi usado.')){S.alimentos=S.alimentos.filter(function(x){return x.id!==fr.dataset.fid;});commit();}return;
  }
});
function setPeso(d,kg){var p=S.pesos.find(function(x){return x.data===d;});if(p)p.kg=kg;else S.pesos.push({data:d,kg:kg});}
function salvarTreino(){
  var r=S.rascunho,exs=r.ex.map(function(e){return {nome:e.nome,sets:e.sets.filter(function(s){return s.ok;}).map(function(s){return {reps:s.reps,carga:s.carga};})};}).filter(function(e){return e.sets.length;});
  if(!exs.length){alert('Marque pelo menos uma série como feita (botão ✓) antes de salvar.');return;}
  var pend=r.ex.reduce(function(a,e){return a+e.sets.filter(function(s){return !s.ok;}).length;},0);
  if(pend&&!confirm(pend+' série(s) não foram marcadas como feitas e não serão salvas. Concluir mesmo assim?'))return;
  var old=sessaoEm(r.data);if(old&&!confirm('Já existe um treino salvo em '+fmtD(r.data)+'. Salvar este também?'))return;
  S.sessoes.push({id:uid(),data:r.data,treino:r.treino,treinoNome:r.nome,ex:exs,obs:r.obs||'',min:Math.round((Date.now()-r.inicio)/60000)});
  S.rascunho=null;stopTimer();commit();location.hash='hoje';
}

/* ---------- mudanças nos campos ---------- */
document.addEventListener('change',function(e){
  var t=e.target;if(!S)return;var id=t.id;
  if(t.dataset.sem!=null){S.semana[t.dataset.sem]=t.value;commit();return;}
  if(t.dataset.tf){var tt=treinoById(t.closest('[data-tid]').dataset.tid);tt[t.dataset.tf]=t.value.trim()||(t.dataset.tf==='nome'?tt.nome:'');commit();return;}
  if(t.dataset.ef){var tr=treinoById(t.closest('[data-tid]').dataset.tid),xe=tr.ex.find(function(x){return x.id===t.closest('[data-eid]').dataset.eid;}),f=t.dataset.ef;
    xe[f]=f==='carga'?pnum(t.value):f==='series'||f==='desc'?(parseInt(t.value,10)||0):t.value.trim();save();return;}
  if(t.dataset.sf){var exb=t.closest('[data-ei]'),sr=t.closest('[data-si]'),st=S.rascunho.ex[+exb.dataset.ei].sets[+sr.dataset.si];
    st[t.dataset.sf]=t.dataset.sf==='reps'?(parseInt(t.value,10)||0):pnum(t.value);
    // carga nova vale para as séries seguintes ainda não feitas
    if(t.dataset.sf==='carga'){var sets=S.rascunho.ex[+exb.dataset.ei].sets;for(var i=+sr.dataset.si+1;i<sets.length;i++)if(!sets[i].ok)sets[i].carga=st.carga;}
    commit();refocus(id);return;}
  if(t.dataset.rd!=null){S.rascunho.data=t.value||TODAY;commit();return;}
  if(t.dataset.robs!=null){S.rascunho.obs=t.value;save();return;}
  if(t.dataset.prog!=null){ui.prog=t.value;render();return;}
  if(t.dataset.meta){S.meta[t.dataset.meta]=parseInt(t.value,10)||0;commit();refocus(id);return;}
  if(t.dataset.perfil){S.perfil[t.dataset.perfil]=t.value;commit();return;}
  if(t.dataset.refi!=null){var i2=+t.dataset.refi,old=S.refeicoes[i2],nv=t.value.trim()||old;S.refeicoes[i2]=nv;S.plano.forEach(function(x){if(x.ref===old)x.ref=nv;});Object.keys(S.diario).forEach(function(d){S.diario[d].forEach(function(x){if(x.ref===old)x.ref=nv;});});commit();return;}
  if(t.dataset.ff){var fo=S.alimentos.find(function(x){return x.id===t.closest('[data-fid]').dataset.fid;}),ff=t.dataset.ff;fo[ff]=ff==='nome'||ff==='un'?(t.value.trim()||(ff==='nome'?fo.nome:'')):pnum(t.value);commit();refocus(id);return;}
});
document.addEventListener('input',function(e){if(e.target.id==='busca'){ui.busca=e.target.value;var pos=e.target.selectionStart;render();var b=document.getElementById('busca');if(b){b.focus();b.setSelectionRange(pos,pos);}}});

/* ---------- diálogo: adicionar alimento ---------- */
var dlg=document.getElementById('dlg'),form=document.getElementById('dlgForm'),fctx=null;
function openFood(ctx,ref){
  fctx={ctx:ctx,ref:ref};
  var refs=S.refeicoes.slice();if(refs.indexOf(ref)<0)refs.push(ref);
  form.innerHTML='<h2 style="font-size:16px">Adicionar alimento</h2>'+
   '<label class="field">Alimento<input type="text" name="food" list="dlFoods" required placeholder="Comece a digitar: arroz, frango, ovo…" autocomplete="off"></label>'+
   '<div class="row"><label class="field">Quantidade<input type="text" name="qtd" inputmode="decimal" required value="100"></label><label class="field">Medida<select name="modo"><option value="g">gramas / ml</option></select></label></div>'+
   '<label class="field">Refeição<select name="ref">'+refs.map(function(r){return '<option'+(r===ref?' selected':'')+'>'+esc(r)+'</option>';}).join('')+'</select></label>'+
   '<div class="preview" id="fprev">Escolha um alimento da lista.</div>'+
   '<div class="small">Não achou? <a href="#alimentos" data-close>Cadastre em Alimentos</a>.</div>'+
   '<div class="actions"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn primary" value="ok">Adicionar</button></div>';
  dlg.returnValue='';dlg.showModal();form.querySelector('[name=food]').focus();
}
function dlgFood(){var v=form.querySelector('[name=food]');return v?foodByName(v.value):null;}
function updPrev(){
  var f=dlgFood(),sel=form.querySelector('[name=modo]'),q=pnum(form.querySelector('[name=qtd]').value),p=document.getElementById('fprev');if(!p)return;
  if(f&&f.u&&!sel.querySelector('[value=un]')){sel.insertAdjacentHTML('beforeend','<option value="un">'+esc(f.un||'unidade')+' ('+f.u+' g)</option>');}
  if(f&&!f.u&&sel.querySelector('[value=un]')){sel.querySelector('[value=un]').remove();}
  if(!f){p.textContent='Escolha um alimento da lista.';return;}
  var m=mac({food:f.id,qtd:q,modo:sel.value});p.innerHTML='<b>'+n0(m.kcal)+' kcal</b> · proteína '+n1(m.prot)+' g · carbo '+n1(m.carb)+' g · gordura '+n1(m.gord)+' g';
}
form.addEventListener('input',function(e){if(e.target.name==='food'){var f=dlgFood(),sel=form.querySelector('[name=modo]');sel.innerHTML='<option value="g">gramas / ml</option>';if(f&&f.u){sel.insertAdjacentHTML('beforeend','<option value="un">'+esc(f.un||'unidade')+' ('+f.u+' g)</option>');}}updPrev();});
form.addEventListener('change',function(e){if(e.target.name==='modo'){var q=form.querySelector('[name=qtd]');if(e.target.value==='un'&&pnum(q.value)>=20)q.value='1';if(e.target.value==='g'&&pnum(q.value)<20)q.value='100';}updPrev();});
form.addEventListener('click',function(e){if(e.target.closest('[data-close]'))dlg.close();});
dlg.addEventListener('close',function(){
  if(dlg.returnValue!=='ok'||!fctx)return;
  var fd=new FormData(form),f=foodByName(fd.get('food'));
  if(!f){alert('Alimento não encontrado na lista. Escolha uma das sugestões ou cadastre em Alimentos.');return;}
  var e={id:uid(),ref:String(fd.get('ref')),food:f.id,qtd:pnum(fd.get('qtd'))||0,modo:fd.get('modo')==='un'?'un':'g'};
  (fctx.ctx==='plano'?S.plano:diaDe(ui.dia)).push(e);dlg.returnValue='';commit();
});

/* ---------- tema ---------- */
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('mt-theme',t);}catch(e){}markTheme();}
function markTheme(){var cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.querySelectorAll('[data-theme-set]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.themeSet===cur);});}
try{var th=localStorage.getItem('mt-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}

/* ---------- login ---------- */
function authClick(){
  if(!window.FB)return;
  if(cloud.uid){if(confirm('Sair da conta? Seus dados continuam salvos nela e uma cópia fica neste navegador.'))FB.signOut();return;}
  FB.signIn().catch(function(e){var c=e&&e.code||'';
    if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){alert('O navegador bloqueou a janela de login. Permita pop-ups para este site (ícone na barra de endereço) e clique de novo em "Entrar com Google".');return;}
    if(c==='auth/unauthorized-domain'){alert('Este endereço ainda não está liberado no Firebase (Authentication › Configurações › Domínios autorizados).');return;}
    alert('Não foi possível entrar ('+(c||'erro')+').');});
}

/* ---------- início ---------- */
document.getElementById('dlEx').innerHTML=EXS.map(function(x){return '<option value="'+esc(x)+'">';}).join('');
S=migrate(readLocal())||empty();
document.getElementById('dlFoods').innerHTML=allFoods().map(function(f){return '<option value="'+esc(f.nome)+'">';}).join('');
var _render=render;render=function(){_render();document.getElementById('dlFoods').innerHTML=allFoods().map(function(f){return '<option value="'+esc(f.nome)+'">';}).join('');};
navHtml();route();markTheme();setStatus('Salvo neste navegador');
if(window.FB)initCloud();else window.addEventListener('fb-ready',initCloud);
})();
</script>
