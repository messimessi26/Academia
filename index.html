<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>Meu Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7;--card:#FFFFFF;--text:#111827;--muted:#6B7280;--line:#E5E7EB;--soft:#EEF0F3;--pill:#FFFFFF;--pillLine:#D9DCE1;
  --acc:#0F766E;--accText:#0F766E;--ok:#16A34A;--warn:#C2410C;--prot:#2563EB;--carb:#F59E0B;--gord:#DB2777;
  --tab:#2B2F36;--tabText:#C9CDD3;--shadow:0 6px 18px rgba(17,24,39,.10);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1013;--card:#171A1F;--text:#ECEEF1;--muted:#9AA1AC;--line:#2A2F37;--soft:#1F232A;--pill:#1C2026;--pillLine:#333944;
  --acc:#2DD4BF;--accText:#5EEAD4;--ok:#4ADE80;--warn:#FB923C;--prot:#60A5FA;--carb:#FBBF24;--gord:#F472B6;
  --tab:#22262D;--tabText:#AEB4BE;--shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1013;--card:#171A1F;--text:#ECEEF1;--muted:#9AA1AC;--line:#2A2F37;--soft:#1F232A;--pill:#1C2026;--pillLine:#333944;
  --acc:#2DD4BF;--accText:#5EEAD4;--ok:#4ADE80;--warn:#FB923C;--prot:#60A5FA;--carb:#FBBF24;--gord:#F472B6;
  --tab:#22262D;--tabText:#AEB4BE;--shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--accText)}
.app{max-width:760px;margin:0 auto;padding:12px 14px 110px}
@media (min-width:1000px){.app{max-width:900px}}
.small{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 2px 12px;gap:8px}
.hdr h1{margin:0;font-size:19px;font-weight:600;text-align:center}
.hdr .r{justify-self:end}
.streak{font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:4px}
.wknav{display:flex;align-items:center;gap:6px;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);text-transform:capitalize}
.wknav span{flex:1;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:2px 0 14px;gap:2px}
.week button{border:0;background:transparent;border-radius:16px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center}
.week span{font-size:13px;color:var(--muted)}
.week b{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:500;color:var(--muted);margin-top:4px}
.week .today b{color:var(--text);font-weight:800}
.week .sel b{background:var(--text);color:var(--bg);font-weight:800}
.week i{display:block;width:6px;height:6px;border-radius:50%;margin:4px auto 0}
.week .dots{display:flex;gap:3px;justify-content:center;min-height:10px}
.week .dots i{margin:4px 0 0}
.cdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#E11D48}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;border-radius:22px;padding:16px;min-height:132px;color:#fff;background:var(--c);display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:var(--shadow);overflow:hidden;border:0;text-align:left}
.tile::before{content:"";position:absolute;right:-28px;bottom:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.tile::after{content:"";position:absolute;right:30px;bottom:-60px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.08)}
.tile b{font-size:19px;font-weight:700;position:relative;z-index:1}
.tile .meta{font-size:12px;opacity:.85;position:relative;z-index:1}
.tile .kb{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}
.tile .ic{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.fab{position:fixed;right:max(18px,calc(50% - 360px));bottom:96px;width:62px;height:62px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;line-height:1;box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:15;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:15px;font-weight:700}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:14px;font-weight:600;padding:9px 14px;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:42px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.circbtn{width:46px;height:46px;border-radius:50%;background:var(--card);border:0;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none;flex-shrink:0}
/* tela do treino */
.tdhead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:4px 0 14px}
.tdhead h1{margin:0;font-size:19px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{border:0;border-radius:999px;color:#fff;font-weight:700;font-size:15px;padding:12px 22px;background:var(--c);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.tdstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 0 16px;border-bottom:1px solid var(--line);margin-bottom:6px;text-align:center}
.tdstats span{display:block;font-size:13px;color:var(--muted)}
.tdstats b{display:block;font-size:22px;font-weight:700;margin-top:4px}
.tdstats .dur{color:var(--c)}
.exrow{display:flex;align-items:center;gap:12px;padding:12px 0}
.av{width:52px;height:52px;border-radius:50%;background:var(--soft);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--c);flex-shrink:0}
.exname{flex:1;min-width:0;font-weight:600;font-size:16px;background:none;border:0;text-align:left;padding:6px 0}
.exname.open{color:var(--c)}
.kebab{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text)}
.chev{width:38px;height:38px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0}
.exbody{padding:0 0 10px}
.note{width:100%;border:0;background:transparent;font-size:15px;color:var(--text);padding:4px 0 10px;resize:none}
.note::placeholder{color:var(--muted)}
.sethead,.setr{display:grid;grid-template-columns:52px 1fr 1fr 1fr 34px;gap:8px;align-items:center}
.sethead{font-size:12px;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.setr{padding:8px 0;border-bottom:1px solid var(--line)}
.circ{width:46px;height:46px;border-radius:50%;border:2px solid var(--c);background:transparent;display:flex;align-items:center;justify-content:center}
.circ[aria-pressed="true"]{background:var(--c)}
.pillin{position:relative}
.pillin input{width:100%;height:48px;border-radius:999px;border:1.5px solid var(--pillLine);background:var(--pill);text-align:center;font-size:17px;font-weight:600;padding:0 22px 0 8px}
.pillin.noU input{padding:0 8px}
.pillin em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;color:var(--muted);pointer-events:none}
.setr.done .pillin input{border-color:var(--c)}
.pillbtn{height:48px;border-radius:999px;border:1.5px solid var(--pillLine);background:var(--pill);font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center;gap:3px;padding:0 6px;min-width:0}
.pillbtn em{font-style:normal;font-size:11px;color:var(--muted);font-weight:500}
.setr.done .pillbtn{border-color:var(--c)}
dialog.pad{margin:auto auto 0;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:0;background:var(--card);color:var(--text)}
.padin{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.padhd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.padv{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.padv small{font-size:16px;color:var(--muted);font-weight:600}
.padq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.padq button{border:1.5px solid var(--line);background:var(--soft);border-radius:14px;height:44px;font-weight:700;font-size:16px}
.padg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.padg button{border:0;background:var(--soft);border-radius:14px;height:56px;font-size:24px;font-weight:600}
.padg button:active,.padq button:active{background:var(--line)}
.padf{display:flex;gap:8px}.padf .btn{flex:1;min-height:52px;font-size:16px}
.addset{width:100%;border:0;border-radius:14px;background:var(--soft);font-weight:600;padding:13px;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.addex{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;padding:14px 0;font-size:16px;font-weight:600;text-align:left}
.addex .plus{width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:400;flex-shrink:0}
.sep{border:0;border-top:1px solid var(--line);margin:0}
.banner{border-radius:18px;padding:14px 16px;color:#fff;background:var(--c);display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;text-decoration:none}
/* gerais */
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.big small{font-size:14px;font-weight:600;color:var(--muted)}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar>div{height:100%;border-radius:6px}
.macro{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft);font-size:14px}
.list li:last-child{border-bottom:0}
.list .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .v{font-weight:600;white-space:nowrap;color:var(--muted);font-size:13px}
.del{border:0;background:transparent;width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted)}
.del svg{stroke:currentColor}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600}
.field .hint{font-weight:400;color:var(--muted);font-size:11px}
.in,.field input,.field select,.field textarea,td input,td select{width:100%;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;font-size:15px}
.field textarea{height:auto;min-height:70px;padding:10px 12px}
.num{text-align:right}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--soft);border-radius:14px;padding:10px 12px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:700;margin-top:3px;white-space:nowrap}
.pos{color:var(--ok)}.neg,.warn{color:var(--warn)}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:inherit;fill:var(--muted);font-size:12px}
.keys{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px}
.seg a,.seg button{flex:1;text-align:center;border:0;background:transparent;border-radius:10px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none}
.seg [aria-current="page"],.seg [aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tablewrap{overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--soft);vertical-align:middle}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.preview{font-size:13px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;line-height:1.5}
details.info summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none}
details.info summary::before{content:"ⓘ ";}
details.info p{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.chips.hscroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips.hscroll::-webkit-scrollbar{display:none}
.chips.hscroll .chip{flex-shrink:0}
.meal{gap:8px;padding:14px 16px}
.mealhd{display:flex;align-items:center;gap:8px}
.mealhd>div{flex:1;min-width:0}
.mealhd h2{margin:0}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--soft);font-size:18px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.plusbtn{background:var(--acc);color:#fff;font-size:22px}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dayttl{flex:1;border:0;background:var(--card);border-radius:14px;height:42px;font-size:16px;font-weight:700;color:var(--text);text-transform:capitalize;box-shadow:var(--shadow)}
.hero{display:flex;align-items:center;gap:16px}
.herol{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.herol>div:not(.small){display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;color:var(--muted)}
.herol b{font-size:18px;color:var(--text);font-variant-numeric:tabular-nums}
.herol .small b{font-size:13px}
.macros3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.macros3>div{display:flex;flex-direction:column;gap:4px}
.macros3 b{font-size:16px}.macros3 b small{font-size:11px;color:var(--muted);font-weight:500}
.semline{display:flex;align-items:center;gap:10px;border-top:1px solid var(--soft);padding-top:10px;color:var(--text);text-decoration:none;font-size:14px}
.semline b{flex:1}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.qa{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:0;border-radius:18px;padding:12px 4px;font-size:12px;font-weight:600;color:var(--text);text-decoration:none;box-shadow:var(--shadow)}
.qa span{font-size:22px}
.wkbal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:66px;margin:8px 0 4px}
.wkbal>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.wb{display:block;width:70%;max-width:26px;border-radius:5px}
.wb.est{opacity:.45}
.fres{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto}
.fitem{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;font-weight:600}
.fitem.on{border-color:var(--acc);background:var(--soft)}
.fitem .small{font-weight:400;white-space:nowrap}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:#fff}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--text)}
/* barra de abas */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 28px));background:var(--tab);border-radius:999px;display:flex;justify-content:space-around;padding:8px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tabText);text-decoration:none;font-size:10px;border-radius:999px;padding:8px 0}
.tabbar a svg{stroke:var(--tabText)}
.tabbar a[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff}
.tabbar a[aria-current="page"] svg{stroke:#fff}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--card);border-radius:999px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:10px;font-weight:700;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap}
.timer button{border:0;border-radius:999px;padding:6px 12px;font-weight:600;background:rgba(127,127,127,.25);color:inherit}
.timer.end{background:var(--ok);color:#fff}
dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--text);width:min(460px,calc(100% - 20px));box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form,.sheet{padding:18px;display:flex;flex-direction:column;gap:12px}
dialog .row{display:flex;gap:10px}
dialog .row>*{flex:1}
dialog .actions{display:flex;justify-content:flex-end;gap:8px}
.sheet h2{margin:0 0 2px;font-size:17px}
.sheet .opt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--soft);border-radius:14px;padding:14px;font-weight:600;font-size:15px;text-align:left}
.sheet .opt.danger{color:var(--warn)}
.welcome{background:var(--card);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.welcome h2{margin:0;font-size:22px}
.welcome p{margin:0;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="app"><div id="view"></div></div>
<nav class="tabbar" id="tabbar" aria-label="Menu"></nav>
<div class="timer" id="timer" hidden role="status" aria-live="polite"><span id="timerTxt"></span><button data-act="timer+">+30s</button><button data-act="timerStop">Fechar</button></div>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<dialog id="pad" class="pad" aria-label="Teclado"></dialog>
<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>
<datalist id="dlFoods"></datalist>
<datalist id="dlEx"></datalist>

<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */
var DOW=['dom','seg','ter','qua','qui','sex','sáb'],DOWL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function uid(){return Math.random().toString(36).slice(2,10);}
function pad(n){return String(n).padStart(2,'0');}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function toD(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}

/* ---------- armazenamento: navegador + Firebase ---------- */
var LS_KEY='meu-treino-v1',APP_ID='academia';
var store={kind:'local'},cloud={uid:null,nome:'',unsub:null},statusTxt='Carregando…';
function setStatus(t){statusTxt=t;var el=document.getElementById('status');if(el)el.textContent=t;}
function readLocal(){try{var r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function writeLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));return true;}catch(e){return false;}}
function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'));},ms);Promise.resolve(p).then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
var saveTimer=null,saving=false,pending=false;
function save(){writeLocal();clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);}
async function flush(){
  if(store.kind!=='cloud'||!cloud.uid){setStatus(writeLocal()?'Salvo neste aparelho':'Não foi possível salvar');return;}
  if(saving){pending=true;return;}
  saving=true;setStatus('Salvando…');
  try{await withTimeout(FB.save(cloud.uid,APP_ID,JSON.stringify(S)),15000);setStatus('Sincronizado com a sua conta');}
  catch(e){setStatus('Sem conexão: salvo neste aparelho');}
  saving=false;if(pending){pending=false;flush();}
}
function commit(){save();render();}

var dedoNaTela=false;
function editando(){var el=document.activeElement;return !!(el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&el.closest('#view'));}
function softCommit(){save();ui.sujo=true;talvezRender();}
function talvezRender(){clearTimeout(ui.rt);ui.rt=setTimeout(function(){if(!ui.sujo)return;if(dedoNaTela||editando()){talvezRender();return;}ui.sujo=false;var y=window.scrollY;render();window.scrollTo(0,y);},450);}
document.addEventListener('pointerdown',function(){dedoNaTela=true;},true);
document.addEventListener('pointerup',function(){setTimeout(function(){dedoNaTela=false;},300);},true);
document.addEventListener('pointercancel',function(){dedoNaTela=false;},true);

function initCloud(){
  if(!window.FB)return;
  FB.onUser(function(u){
    if(cloud.unsub){cloud.unsub();cloud.unsub=null;}
    cloud.uid=u?u.uid:null;cloud.nome=u?(u.displayName||u.email||''):'';
    if(!u){store={kind:'local'};setStatus('Salvo neste aparelho');ui.cloudPronto=true;aplicarRelogio();render();return;}
    ui.cloudPronto=false;
    setStatus('Conectando…');var first=true;
    cloud.unsub=FB.watch(u.uid,APP_ID,function(snap){
      if(snap.metadata.hasPendingWrites)return;
      var remote=null;if(snap.exists()){try{remote=migrate(JSON.parse((snap.data()||{}).estado));}catch(e){}}
      if(first){first=false;store={kind:'cloud'};
        if(remote){S=remote;writeLocal();}else if(!isEmpty(S))flush();
        setStatus('Sincronizado com a sua conta');ui.cloudPronto=true;aplicarRelogio();render();return;}
      if(remote){S=remote;writeLocal();render();setStatus('Sincronizado com a sua conta');}
    },function(){store={kind:'local'};setStatus('Sem acesso à conta: salvo neste aparelho');});
  });
}

/* ---------- cardio: estimativa de calorias ---------- */

    var vo2=out.corrida?3.5+0.2*v+0.9*v*g:3.5+0.1*v+1.8*v*g;out.kcal=vo2*kg/1000*5*min;out.metodo=(out.corrida?'corrida':'caminhada')+' (velocidade e inclinação)';return out;}
  var mets=CMET[c.tipo]||CMET.outro,i=Math.max(0,['leve','moderada','intensa'].indexOf(c.int||'moderada'));

/* ---------- gráficos SVG ---------- */
function niceScale(lo,hi){if(lo===hi){lo-=1;hi+=1;}var span=hi-lo,step=Math.pow(10,Math.floor(Math.log10(span/4)));var err=span/4/step;step*=err>=5?10:err>=2.5?5:err>=1.5?2:1;return {lo:Math.floor(lo/step)*step,hi:Math.ceil(hi/step)*step,step:step};}
function chart(labels,series,opt){
  opt=opt||{};var W=640,H=230,L=46,R=W-10,T=12,B=H-28,vals=[];series.forEach(function(s){s.v.forEach(function(v){if(v!=null)vals.push(v);});});if(!vals.length)return '';
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);if(opt.zero)lo=Math.min(0,lo);var sc=niceScale(lo,hi);
  var Y=function(v){return T+(sc.hi-v)/(sc.hi-sc.lo)*(B-T);},n=labels.length,bw=Math.min(28,(R-L)/n*0.6),X=function(i){return opt.bars?L+(i+0.5)*(R-L)/n:(n<2?(L+R)/2:L+i*(R-L)/(n-1));};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(series.map(function(x){return x.name;}).join(', '))+'">';
  for(var v=sc.lo;v<=sc.hi+sc.step/2;v+=sc.step){var y=Y(v);s+='<line x1="'+L+'" x2="'+R+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="3 4"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+(Math.abs(v)>=10000?n0(v/1000)+' mil':n1(v))+'</text>';}
  var every=Math.ceil(n/7);labels.forEach(function(l,i){if(i%every===0||i===n-1)s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(l)+'</text>';});
  series.forEach(function(se){
    if(se.bar){se.v.forEach(function(v,i){if(v==null)return;var y=Y(Math.max(v,0)),y0=Y(Math.max(sc.lo,0));s+='<rect x="'+(X(i)-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(y0-y,1)+'" rx="5" fill="'+se.c+'"><title>'+esc(labels[i])+': '+n0(v)+(opt.unit||'')+'</title></rect>';});return;}
    var d='';se.v.forEach(function(v,i){if(v==null)return;d+=(d?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);});
    s+='<path d="'+d+'" fill="none" stroke="'+se.c+'" stroke-width="2.5" stroke-linejoin="round"'+(se.dash?' stroke-dasharray="6 5"':'')+'/>';

  return '<div class="chart">'+s+'</svg></div>';
}

function diasHtml(t){return '<h2>Dias do '+esc(t.nome)+'</h2><div class="small">Toque nos dias em que você faz este treino. Ele aparece como sugestão em Início.</div><div class="chips" style="--c:'+corHex(t.cor)+'">'+[0,1,2,3,4,5,6].map(function(d){var other=S.semana[d]&&S.semana[d]!==t.id?treinoById(S.semana[d]):null;return '<button class="chip" data-act="toggleDia" data-d="'+d+'" aria-pressed="'+(S.semana[d]===t.id)+'">'+DOWL[d].slice(0,3)+(other?' <span class="small">('+esc(other.nome)+')</span>':'')+'</button>';}).join('')+'</div>';}
function setPeso(d,kg){var p=S.pesos.find(function(x){return x.data===d;});if(p)p.kg=kg;else S.pesos.push({data:d,kg:kg});}
function copyTo(src){var dst=S.diario[ui.dia]||(S.diario[ui.dia]=[]);src.forEach(function(e){dst.push({id:uid(),ref:e.ref,food:e.food,qtd:e.qtd,modo:e.modo});});commit();}

/* ---------- campos ---------- */
document.addEventListener('change',function(e){
  var t=e.target;if(!S)return;var id=t.id;
  if(t.dataset.sf){var xw=t.closest('[data-xi]'),sw=t.closest('[data-si]'),list=exList(R.arg),ex=list[+xw.dataset.xi],s=ex.sets[+sw.dataset.si],f=t.dataset.sf;
    s[f]=f==='carga'?pnum(t.value):(parseInt(t.value,10)||0);
    if(f==='carga')for(var i=+sw.dataset.si+1;i<ex.sets.length;i++){if(!ex.sets[i].ok&&ex.sets[i].carga<s.carga)ex.sets[i].carga=s.carga;}
    softCommit();return;}
  if(t.dataset.sref!=null){var ssv=salvaById(t.closest('[data-sid]').dataset.sid);if(ssv){ssv.ref=t.value;softCommit();}return;}
  if(t.dataset.note!=null){var xw2=t.closest('[data-xi]');exList(R.arg)[+xw2.dataset.xi].nota=t.value;save();return;}
  if(t.dataset.prev){S.prev[t.dataset.prev]=t.dataset.prev==='cardioSem'&&t.value.trim()===''?'':pnum(t.value);softCommit();return;}
  if(t.dataset.meta){S.meta[t.dataset.meta]=parseInt(t.value,10)||0;softCommit();return;}
  if(t.dataset.perfil){S.perfil[t.dataset.perfil]=t.value;softCommit();return;}
  if(t.dataset.refi!=null){var i2=+t.dataset.refi,old=S.refeicoes[i2],nv=t.value.trim()||old;S.refeicoes[i2]=nv;S.plano.forEach(function(x){if(x.ref===old)x.ref=nv;});Object.keys(S.diario).forEach(function(d){S.diario[d].forEach(function(x){if(x.ref===old)x.ref=nv;});});softCommit();return;}
  if(t.dataset.ff){var fo=S.alimentos.find(function(x){return x.id===t.closest('[data-fid]').dataset.fid;}),ff=t.dataset.ff;fo[ff]=ff==='nome'||ff==='un'?(t.value.trim()||(ff==='nome'?fo.nome:'')):pnum(t.value);softCommit();return;}
});

/* ---------- teclado próprio para peso / repetições / descanso (sem o teclado do celular) ---------- */
var padEl=document.getElementById('pad'),padCtx=null;
function fmtPad(f,n){return f==='carga'?n1(n):String(Math.round(n));}
function openPad(xi,si,f){var e=exList(R.arg)[xi];if(!e||!e.sets[si])return;var s=e.sets[si];padCtx={xi:xi,si:si,f:f,val:fmtPad(f,+s[f]||0),fresh:true,nome:e.nome};drawPad();if(!padEl.open)padEl.showModal();}
function drawPad(){var c=padCtx,lab={carga:'Peso',reps:'Repetições',desc:'Descanso'}[c.f],un={carga:'kg',reps:'reps',desc:'seg'}[c.f],
  quick=c.f==='carga'?[['add',-5],['add',-2.5],['add',2.5],['add',5]]:c.f==='reps'?[['add',-2],['add',-1],['add',1],['add',2]]:[['set',30],['set',60],['set',90],['set',120]];
  var e=exList(R.arg)[c.xi],ultimo=c.f==='desc'||(c.f==='reps'&&c.si>=e.sets.length-1);
  padEl.innerHTML='<div class="padin"><div class="padhd"><div style="min-width:0"><div class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(c.nome)+' · Série '+(c.si+1)+'</div><b>'+lab+'</b></div><button type="button" class="kebab" data-k="x" aria-label="Fechar">✕</button></div>'+
    '<div class="padv" aria-live="polite">'+esc(c.val||'0')+'<small> '+un+'</small></div>'+
    '<div class="padq">'+quick.map(function(q){return '<button type="button" data-k="'+q[0]+'" data-v="'+q[1]+'">'+(q[0]==='set'?q[1]+'s':(q[1]>0?'+':'−')+n1(Math.abs(q[1])))+'</button>';}).join('')+'</div>'+
    '<div class="padg">'+['1','2','3','4','5','6','7','8','9',c.f==='carga'?',':'','0','⌫'].map(function(k){return k?'<button type="button" data-k="d" data-v="'+k+'"'+(k==='⌫'?' aria-label="Apagar"':'')+'>'+k+'</button>':'<span></span>';}).join('')+'</div>'+
    '<div class="padf"><button type="button" class="btn" data-k="ok">OK</button>'+(ultimo?'':'<button type="button" class="btn primary" data-k="next">'+(c.f==='carga'?'OK → repetições':'OK → próxima série')+'</button>')+'</div></div>';}
function aplicarPad(){var c=padCtx,e=exList(R.arg)[c.xi],s=e&&e.sets[c.si];if(!s)return;var n=c.f==='carga'?pnum(c.val):(parseInt(c.val,10)||0);s[c.f]=Math.max(0,n);
  if(c.f==='carga')for(var i=c.si+1;i<e.sets.length;i++){if(!e.sets[i].ok&&e.sets[i].carga<s.carga)e.sets[i].carga=s.carga;}save();}
padEl.addEventListener('click',function(ev){
  if(ev.target===padEl){padEl.close();render();return;}
  var b=ev.target.closest('[data-k]');if(!b||!padCtx)return;var k=b.dataset.k,v=b.dataset.v,c=padCtx;
  if(k==='x'){padEl.close();return;}
  if(k==='d'){if(v==='⌫'){c.val=c.fresh?'':c.val.slice(0,-1);c.fresh=false;}else{if(c.fresh){c.val='';c.fresh=false;}if(v===','&&c.val.indexOf(',')>-1)return;if(c.val.length<6)c.val=(c.val==='0'&&v!==','?'':c.val)+v;}drawPad();return;}
  if(k==='add'){c.val=fmtPad(c.f,Math.max(0,pnum(c.val)+(+v)));c.fresh=true;drawPad();return;}
  if(k==='set'){c.val=String(v);c.fresh=true;drawPad();return;}
  if(k==='ok'||k==='next'){aplicarPad();
    if(k==='next'){var e=exList(R.arg)[c.xi],nf=c.f==='carga'?['reps',c.si]:['carga',c.si+1];if(e&&e.sets[nf[1]]){padCtx={xi:c.xi,si:nf[1],f:nf[0],val:fmtPad(nf[0],+e.sets[nf[1]][nf[0]]||0),fresh:true,nome:e.nome};render();drawPad();return;}}
    padEl.close();render();}
});

/* ---------- adicionar alimento ---------- */
var dlg=document.getElementById('dlg'),form=document.getElementById('dlgForm'),fctx=null;
// busca com toque (funciona bem no iPhone) + botões de medida: gramas ou a unidade do alimento
var fsel={food:null,modo:'g'};
function unTxt(f){return (f.un||'unidade')+' · '+f.u+(/\(ml\)/.test(f.nome)?' ml':' g');}
function openFood(ctx,ref,sid){
  fctx={ctx:ctx,ref:ref,sid:sid};fsel={food:null,modo:'g'};var refs=S.refeicoes.slice();if(ref&&refs.indexOf(ref)<0)refs.push(ref);
  form.innerHTML='<h2 style="margin:0;font-size:17px">Adicionar alimento</h2>'+
   '<label class="field">Buscar alimento<input type="search" id="fq" placeholder="Digite: ovo, arroz, frango…" autocomplete="off"></label>'+
   '<div id="fres" class="fres"></div><div id="fsel" hidden></div>'+
   '<div id="fqtd" hidden><div class="row"><label class="field">Quantidade<input type="text" id="fqv" inputmode="decimal" value="1"></label></div><div class="chips" id="funits" style="margin-top:8px"></div></div>'+
   (ctx==='salva'?'':'<label class="field">Refeição<select name="ref">'+refs.map(function(r){return '<option'+(r===ref?' selected':'')+'>'+esc(r)+'</option>';}).join('')+'</select></label>')+
   '<div class="preview" id="fprev">Busque e toque num alimento.</div><div class="small">Não achou? Cadastre na aba Alimentos (com gramas por unidade, se quiser).</div>'+
   '<div class="actions"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn primary" value="ok">Adicionar</button></div>';
  fBusca('');dlg.returnValue='';dlg.showModal();document.getElementById('fq').focus();
}
function fBusca(q){var k=norm(q),l=allFoods();
  if(k){var a=l.filter(function(f){return norm(f.nome).indexOf(k)===0;}),b=l.filter(function(f){var n=norm(f.nome);return n.indexOf(k)>0||k.split(' ').every(function(w){return n.indexOf(w)>-1;});}).filter(function(f){return a.indexOf(f)<0;});l=a.concat(b);}
  else{var usados={};Object.keys(S.diario).sort().slice(-14).forEach(function(d){S.diario[d].forEach(function(e){usados[e.food]=(usados[e.food]||0)+1;});});l=l.filter(function(f){return usados[f.id];}).sort(function(x,y){return usados[y.id]-usados[x.id];});if(!l.length)l=allFoods().slice(0,8);}
  document.getElementById('fres').innerHTML=(k||l.length?'':'')+l.slice(0,8).map(function(f){return '<button type="button" class="fitem'+(fsel.food===f.id?' on':'')+'" data-pick="'+f.id+'"><span>'+esc(f.nome)+'</span><span class="small">'+n0(f.kcal)+' kcal/100'+(/\(ml\)/.test(f.nome)?'ml':'g')+(f.u?' · '+esc(f.un):'')+'</span></button>';}).join('')||'<div class="small">Nada encontrado.</div>';}
function fUnits(){var f=foodById(fsel.food);if(!f)return;document.getElementById('funits').innerHTML='<button type="button" class="chip" data-modo="g" aria-pressed="'+(fsel.modo==='g')+'">'+(/\(ml\)/.test(f.nome)?'ml':'gramas')+'</button>'+(f.u?'<button type="button" class="chip" data-modo="un" aria-pressed="'+(fsel.modo==='un')+'">'+esc(unTxt(f))+'</button>':'');}
function updPrev(){var f=foodById(fsel.food),p=document.getElementById('fprev');if(!p)return;if(!f){p.textContent='Busque e toque num alimento.';return;}
  var q=pnum(document.getElementById('fqv').value),m=mac({food:f.id,qtd:q,modo:fsel.modo});p.innerHTML='<b>'+esc(f.nome)+'</b> · '+qtdTxt({food:f.id,qtd:q,modo:fsel.modo})+'<br><b>'+n0(m.kcal)+' kcal</b> · proteína '+n1(m.prot)+' g · carbo '+n1(m.carb)+' g · gordura '+n1(m.gord)+' g';}
form.addEventListener('input',function(e){if(e.target.id==='fq')fBusca(e.target.value);updPrev();});
form.addEventListener('click',function(e){
  var pk=e.target.closest('[data-pick]');if(pk){var f=foodById(pk.dataset.pick);fsel.food=f.id;fsel.modo=f.u?'un':'g';document.getElementById('fqv').value=f.u?'1':'100';document.getElementById('fqtd').hidden=false;fBusca(document.getElementById('fq').value);fUnits();updPrev();var qv=document.getElementById('fqv');qv.focus();qv.select();return;}
  var md=e.target.closest('[data-modo]');if(md){var qv2=document.getElementById('fqv');if(md.dataset.modo!==fsel.modo){fsel.modo=md.dataset.modo;qv2.value=fsel.modo==='un'?'1':'100';}fUnits();updPrev();}});
// salva no envio (mais confiável que o evento "close")
form.addEventListener('submit',function(e){
  var rv=e.submitter?e.submitter.value:'ok';if(rv!=='ok'||!fctx)return;var f=foodById(fsel.food);
  if(!f){e.preventDefault();alert('Toque num alimento da lista de resultados.');return;}
  var q=pnum(document.getElementById('fqv').value);if(!(q>0)){e.preventDefault();alert('Informe a quantidade.');return;}
  var rf=form.querySelector('[name=ref]'),it={id:uid(),ref:rf?rf.value:'',food:f.id,qtd:q,modo:fsel.modo};
  if(fctx.ctx==='salva'){var sv=(S.salvas||[]).find(function(x){return x.id===fctx.sid;});if(sv){delete it.ref;sv.itens.push(it);}}
  else if(fctx.ctx==='plano')S.plano.push(it);else(S.diario[ui.dia]||(S.diario[ui.dia]=[])).push(it);commit();
});

function setTheme(t){if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('mt-theme',t);}catch(e){}markTheme();}
function markTheme(){var a=document.documentElement.getAttribute('data-theme')||'auto';document.querySelectorAll('[data-theme-set]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.themeSet===a);});}
try{var th=localStorage.getItem('mt-theme');if(th&&th!=='auto')document.documentElement.setAttribute('data-theme',th);}catch(e){}
function authIn(){if(!window.FB)return;FB.signIn().catch(function(e){var c=e&&e.code||'';
  if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;
  if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){alert('O navegador bloqueou a janela de login. Permita pop-ups para este site e toque de novo em "Entrar com Google".');return;}
  if(c==='auth/unauthorized-domain'){alert('Este endereço ainda não está liberado no Firebase (Domínios autorizados).');return;}
  alert('Não foi possível entrar ('+(c||'erro')+').');});}
